services:
  mediainfo:
    image: ${MEDIAINFO_IMAGE:-mediainfo-local}
    container_name: ${MEDIAINFO_CONTAINER_NAME:-mediainfo-local}
    build:
      context: .
      target: ${BUILD_TARGET:-runtime-standard}
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        http_proxy: "${http_proxy:-}"
        https_proxy: "${https_proxy:-}"
    privileged: true
    ports:
      - "${HOST_PORT:-28888}:${PORT:-28888}"
    environment:
      PORT: "${PORT:-28888}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-20m}"
      ENGINE_TYPE: "${ENGINE_TYPE:-script}"
      WEB_USERNAME: "${WEB_USERNAME:-}"
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
    volumes:
      - /lib/modules:/lib/modules:ro
      - ${MEDIA_PATH_1:-/path/to/your/media}:/media_path1:ro
      # - ${MEDIA_PATH_2:-./test-media2}:/media_path2:ro
      # - ${MEDIA_PATH_3:-./test-media3}:/media_path3:ro
    restart: unless-stopped