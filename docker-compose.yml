services:
  mediainfo:
    image: ghcr.io/yeahzero/mediainfowebui:latest
    container_name: mediainfo
    build:
      context: .
      target: native
      args:
        ALPINE_MIRROR: mirrors.aliyun.com
        NPM_REGISTRY: https://registry.npmmirror.com
        BUILD_VERSION: ${BUILD_VERSION:-1.5.6}
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        PROJECT_VERSION: ${PROJECT_VERSION:-1.5.6}
    privileged: true
    ports:
      - "28888:28888"
    environment:
      TZ: "Asia/Shanghai"
      PORT: "28888"
      REQUEST_TIMEOUT: "30m"
      MEDIAINFO_BIN: "/usr/bin/mediainfo"
      ENGINE_TYPE: "native"
      ENABLE_NATIVE_ENGINE: "1"
    volumes:
      - /lib/modules:/lib/modules:ro
      - ${MEDIA_PATH:-/path/to/your/media}:/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:28888/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3